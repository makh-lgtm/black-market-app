<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>BLACK MARKET</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0d0f12;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      width: 100%;
      text-align: center;
      margin-top: 10px;
      margin-bottom: 25px;
    }
    .title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .card {
      background: #16191f;
      border: 1px solid #232730;
      border-radius: 18px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .user-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 14px;
      color: #9ca3af;
    }
    .user-name {
      color: #f3f4f6;
      font-weight: 700;
      font-size: 16px;
    }
    .balance-box {
      text-align: center;
      padding: 20px 0;
      border-top: 1px solid #232730;
      border-bottom: 1px solid #232730;
      margin-bottom: 15px;
    }
    .balance-label {
      font-size: 12px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .balance-value {
      font-size: 34px;
      font-weight: 800;
      color: #10b981;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #9ca3af;
    }
    .btn {
      width: 100%;
      max-width: 400px;
      background: #059669;
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
    }
    .btn-disabled {
      background: #374151;
      color: #9ca3af;
    }
    #debugLog {
      width: 100%;
      max-width: 400px;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      background: #1e1b18;
      border: 1px solid #d97706;
      color: #fbbf24;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">BLACK MARKET</div>
    <div class="subtitle">Экономический Синдикат</div>
  </div>

  <div class="card">
    <div class="user-info">
      <div>Игрок: <span id="playerName" class="user-name">Поиск профиля...</span></div>
      <div id="playerTag" style="font-size: 12px; color: #6b7280;">ID: ...</div>
    </div>
    <div class="balance-box">
      <div class="balance-label">Баланс наличных</div>
      <div id="balance" class="balance-value">... $</div>
    </div>
    <div class="stats-row">
      <span>Непогашенный бонус:</span>
      <span id="bonusDebt" style="color: #f87171;">... $</span>
    </div>
  </div>

  <button id="bonusBtn" class="btn" onclick="claimBonus()">
    Получить бонус +50 000 $
  </button>

  <div id="debugLog">Инициализация игры...</div>

  <script>
    const SUPABASE_URL = 'ТВОЙ_API_URL';
    const SUPABASE_ANON_KEY = 'ТВОЙ_PUBLISHABLE_KEY';

    const logEl = document.getElementById('debugLog');
    function log(msg) {
      logEl.innerText = msg;
    }

    let supabaseClient = null;
    let tgUser = null;
    let currentPlayer = null;

    try {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      log('Supabase подключен.');
    } catch (e) {
      log('Ошибка создания Supabase клиента: ' + e.message);
    }

    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
      }
    } catch (e) {
      console.warn(e);
    }

    // Если запуск не из Telegram, даем временный ID
    if (!tgUser || !tgUser.id) {
      tgUser = { id: 777001, first_name: 'Игрок', username: 'browser_user' };
      log('Запущено без Telegram ID, используем тестовый ID');
    } else {
      log('Пользователь определён: ' + tgUser.first_name + ' (ID: ' + tgUser.id + ')');
    }

    async function init() {
      try {
        log('Отправка запроса в базу...');
        const { data, error } = await supabaseClient.rpc('get_or_create_player', {
          p_id: tgUser.id,
          p_username: tgUser.username || '',
          p_first_name: tgUser.first_name || 'Игрок'
        });

        if (error) {
          log('Ошибка RPC get_or_create_player: ' + error.message);
          return;
        }

        currentPlayer = data;
        log('Профиль загружен успешно!');
        render();
      } catch (err) {
        log('Сбой сети: ' + err.message);
      }
    }

    function render() {
      if (!currentPlayer) return;
      document.getElementById('playerName').innerText = currentPlayer.first_name;
      document.getElementById('playerTag').innerText = 'ID: ' + currentPlayer.id;
      document.getElementById('balance').innerText = Number(currentPlayer.balance).toLocaleString('ru-RU') + ' $';
      document.getElementById('bonusDebt').innerText = Number(currentPlayer.bonus_debt).toLocaleString('ru-RU') + ' $';

      const btn = document.getElementById('bonusBtn');
      if (currentPlayer.balance >= 1500 || currentPlayer.bonus_debt > 0) {
        btn.classList.add('btn-disabled');
      } else {
        btn.classList.remove('btn-disabled');
      }
    }

    async function claimBonus() {
      const btn = document.getElementById('bonusBtn');
      btn.innerText = 'Проверка...';

      try {
        const { data, error } = await supabaseClient.rpc('claim_bonus', {
          p_id: tgUser.id
        });

        if (error) {
          log('Ошибка бонуса: ' + error.message);
          return;
        }

        if (data.success) {
          log('Бонус зачислен!');
          currentPlayer.balance = data.new_balance;
          currentPlayer.bonus_debt = 50000;
          render();
        } else {
          log('Отказ: ' + data.message);
        }
      } catch (err) {
        log('Ошибка вызова: ' + err.message);
      } finally {
        btn.innerText = 'Получить бонус +50 000 $';
      }
    }

    init();
  </script>
</body>
</html>
